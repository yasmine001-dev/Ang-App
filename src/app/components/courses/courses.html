<section class="container">
  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4">
    <div>
      <h1 class="mb-1">Courses</h1>
      <p class="text-body-secondary mb-0">Filter by category and register for the courses you want to track.</p>
    </div>
    <div class="text-md-end">
      <div class="fs-5 fw-semibold">Total Order Price</div>
      <div class="display-6 mb-0">{{ totalOrderPrice | currency }}</div>
    </div>
  </div>

  <div class="card shadow-sm border-0 mb-4">
    <div class="card-body">
      <label for="categoryFilter" class="form-label fw-semibold">Choose category</label>
      <select id="categoryFilter" class="form-select" [(ngModel)]="selectedCatId">
        <option value="0">All Categories</option>
        @for (category of categories; track category.id) {
          <option [value]="category.id">{{ category.name }}</option>
        }
      </select>
    </div>
  </div>

  @if (lastRegisteredCourse) {
    <div class="alert alert-success shadow-sm border-0">
      Last registered course: <strong>{{ lastRegisteredCourse }}</strong>
    </div>
  }

  @if (isLoading) {
    <div class="alert alert-info mb-0">Loading courses...</div>
  } @else {
    <app-course-list
      [courses]="courses"
      [selectedCatId]="selectedCatId"
      [categoryName]="selectedCategoryName"
      (totalOrderPriceChange)="onTotalOrderPriceChange($event)"
      (courseRegistered)="onCourseRegistered($event)"
    ></app-course-list>
  }
</section>
